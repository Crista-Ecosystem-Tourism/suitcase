name: Suitcase mobile CI

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'services/**'
      - 'types/**'
      - 'app.json'
      - 'babel.config.js'
      - 'index.ts'
      - 'metro.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'services/**'
      - 'types/**'
      - 'app.json'
      - 'babel.config.js'
      - 'index.ts'
      - 'metro.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: suitcase-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck Expo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
